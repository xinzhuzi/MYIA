name: Feature request / 功能建议
description: Suggest an idea for 世事. / 给 世事 提个想法。
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **支持边界 / Support scope:** feature ideas are welcome. Usage questions
        go to the docs first — `docs/en/getting-started.md` and the FAQ; this
        is a personal project, no response-time commitment, and acceptance is
        weighed against the design principles at the end of this form.
        **支持边界:**欢迎提功能建议;使用咨询请先读 `docs/zh/getting-started.md`
        与 FAQ;个人项目,不承诺响应时限,是否采纳按表尾设计原则权衡。

  - type: textarea
    id: problem
    attributes:
      label: Problem / 想解决的问题
      description: What intelligence category or workflow is hard today? / 今天哪类情报或工作流做不了、很别扭?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 建议方案
      description: What should change — ideally phrased as YAML/CLI surface, since that is what agents consume. / 最好用 YAML/CLI 的形态描述(agent 要消费的就是这层)。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives & prior art / 备选与先例
      description: Existing tools that solve this, and why it still fits 世事. / 现有工具怎么解决的,为什么仍值得进 世事。

  - type: checkboxes
    id: principles
    attributes:
      label: Design principles / 设计原则自检
      description: 世事 is AI-native and dependency-light; proposals are weighed against this. / 世事 是 AI-NATIVE 且核心零重依赖的项目,建议将对照以下原则权衡。
      options:
        - label: An agent could operate the proposed surface from `--json` output alone. / 该功能对 agent 可用(仅凭 --json 输出即可操作)。
        - label: It fits as config (YAML), an optional extra, or a plugin — not a new core dependency. / 以配置/可选依赖/插件承载,不新增核心重依赖。
