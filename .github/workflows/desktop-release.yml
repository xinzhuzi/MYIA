# Desktop Release — 桌面端打包流水线(PRD 10-02-v11-desktop-app:updater + 打包流水线)。
# 触发:推送 v* tag;另留 workflow_dispatch 供主人手动演练。
# 产物:macOS dmg(主线)+ Windows msi(构建级验证,允许失败)→ 全部附到 GitHub Release。
#
# ── updater 签名体系(详见 desktop/UPDATER.md)────────────────────────────────
#   私钥/密码绝不入库,仅经仓库 Secrets 注入,共 3 个:
#     TAURI_UPDATER_PUBKEY               公钥(替换 tauri.conf.json 的占位符)
#     TAURI_SIGNING_PRIVATE_KEY          签名私钥(npx tauri signer generate 产出)
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD 私钥密码(未设密码则留空)
#   真实公钥 + createUpdaterArtifacts + tag 版本号经 `tauri build --config` 合并片
#   注入(基础 conf 保持占位符且不开签名,本地无钥构建不破)。Secrets 缺失时守卫
#   步骤直接中文报错,不产出半成品 release。
#
# ── 构建链 ────────────────────────────────────────────────────────────────────
#   build-sidecar.sh <target-triple>(PyInstaller,不支持交叉编译 → 按平台各建一个
#   job;MYIA_SIDECAR_SKIP=1 让 beforeBuildCommand 链复用前一步产物不重复打包)
#   → npx tauri build --bundles <app,dmg|msi>(vite 前端经 beforeBuildCommand 链构建;
#   macOS 必须带 app 目标,updater 的 tar.gz/.sig 才会产出)。
#
# ── 已知边界 ─────────────────────────────────────────────────────────────────
#   * macOS 仅 aarch64(macos-14);x86_64/ universal 未配,需要时加 target 扩展;
#   * Windows job 为构建级验证(continue-on-error):能出 msi 即算通过,实机安装/
#     升级交互需主人在 Windows 上确认;失败不阻塞 macOS 发布;
#   * Windows 产物不自动写 latest.json(mac 主线只写 darwin-aarch64 条目),
#     windows-x86_64 条目按 desktop/UPDATER.md 第三节手工补。

name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # 上传 Release 附件(gh-release)

jobs:
  macos-dmg:
    name: macOS dmg(aarch64,updater 主线)
    runs-on: macos-14 # arm64,与 sidecar target aarch64-apple-darwin 一致
    steps:
      - uses: actions/checkout@v4

      - name: 守卫:updater secrets 必须已配置(配置方法见 desktop/UPDATER.md)
        env:
          HAS_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY != '' }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          miss=""
          [ "$HAS_PUBKEY" = "true" ] || miss="$miss TAURI_UPDATER_PUBKEY"
          [ "$HAS_KEY" = "true" ] || miss="$miss TAURI_SIGNING_PRIVATE_KEY"
          if [ -n "$miss" ]; then
            echo "::error::仓库缺少 updater secrets:$miss。请到 Settings → Secrets and variables → Actions 按 desktop/UPDATER.md 第二节配置(npx tauri signer generate 生成)。"
            exit 1
          fi
          echo "updater secrets OK(密码未配置视为空密码,签名时需一致)。"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache(desktop/src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装桌面端 npm 依赖(@tauri-apps/cli)
        working-directory: desktop
        run: npm ci --no-fund --no-audit

      - name: 安装前端 npm 依赖(ui-src)
        working-directory: desktop/ui-src
        run: npm ci --no-fund --no-audit

      - name: 构建 sidecar(aarch64-apple-darwin)
        working-directory: desktop
        run: bash build-sidecar.sh aarch64-apple-darwin

      - name: 写 updater 发布配置片(真实公钥 + createUpdaterArtifacts + tag 版本)
        working-directory: desktop/src-tauri
        # CI-only 文件:只存在于 runner 工作区,不入库(基础 conf 仍是占位符)
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          jq -n --arg v "$VERSION" --arg p "$PUBKEY" \
            '{version: $v, bundle: {createUpdaterArtifacts: true},
              plugins: {updater: {pubkey: $p}}}' > tauri.release.conf.json
          echo "release conf merged from tag $TAG (version $VERSION)"

      - name: Tauri 构建(app+dmg + 签名更新包)
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MYIA_SIDECAR_SKIP: "1" # beforeBuildCommand 链复用上一步 sidecar 产物
        # --bundles 必须含 app:updater 的 tar.gz/.sig 只在 MacOsBundle 目标在列时
        # 产出(tauri-bundler 门逻辑),仅 dmg 会跳过更新包且随后把 .app 中间产物
        # 删掉 —— latest.json 步骤必因缺 .sig 而红(v1.1 评审修复)。
        run: npx tauri build --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: 生成 latest.json(updater 索引,darwin-aarch64 条目)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BUNDLE="desktop/src-tauri/target/release/bundle"
          SIG="$(cat "$BUNDLE/macos/MYIA.app.tar.gz.sig")"
          jq -n --arg v "$VERSION" --arg tag "$TAG" --arg repo "$REPO" --arg sig "$SIG" \
            '{version: $v,
              notes: ("MYIA " + $v),
              pub_date: (now | todateiso8601),
              platforms: {
                "darwin-aarch64": {
                  signature: $sig,
                  url: ("https://github.com/" + $repo + "/releases/download/" + $tag + "/MYIA.app.tar.gz")
                }
              }}' > latest.json
          cat latest.json

      - name: 上传 Release 附件(dmg / 更新包+签名 / latest.json)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/MYIA.app.tar.gz
            desktop/src-tauri/target/release/bundle/macos/MYIA.app.tar.gz.sig
            latest.json

  windows-msi:
    name: Windows msi(构建级验证,允许失败)
    # PRD 约定:Windows 至少完成构建级验证;实机交互需主人。
    # 本 job 失败不阻塞 macOS 发布(continue-on-error),但失败会标红提醒跟进。
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 守卫:updater secrets 必须已配置(配置方法见 desktop/UPDATER.md)
        shell: bash
        env:
          HAS_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY != '' }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          miss=""
          [ "$HAS_PUBKEY" = "true" ] || miss="$miss TAURI_UPDATER_PUBKEY"
          [ "$HAS_KEY" = "true" ] || miss="$miss TAURI_SIGNING_PRIVATE_KEY"
          if [ -n "$miss" ]; then
            echo "::error::仓库缺少 updater secrets:$miss。请到 Settings → Secrets and variables → Actions 按 desktop/UPDATER.md 第二节配置(npx tauri signer generate 生成)。"
            exit 1
          fi
          echo "updater secrets OK(密码未配置视为空密码,签名时需一致)。"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache(desktop/src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: 安装桌面端 npm 依赖(@tauri-apps/cli)
        working-directory: desktop
        run: npm ci --no-fund --no-audit

      - name: 安装前端 npm 依赖(ui-src)
        working-directory: desktop/ui-src
        run: npm ci --no-fund --no-audit

      - name: 构建 sidecar(x86_64-pc-windows-msvc)
        working-directory: desktop
        shell: bash
        run: bash build-sidecar.sh x86_64-pc-windows-msvc

      - name: 写 updater 发布配置片(真实公钥 + createUpdaterArtifacts + tag 版本)
        working-directory: desktop/src-tauri
        shell: bash
        env:
          PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          jq -n --arg v "$VERSION" --arg p "$PUBKEY" \
            '{version: $v, bundle: {createUpdaterArtifacts: true},
              plugins: {updater: {pubkey: $p}}}' > tauri.release.conf.json
          echo "release conf merged from tag $TAG (version $VERSION)"

      - name: Tauri 构建(msi;WiX 由 tauri CLI 自动下载)
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MYIA_SIDECAR_SKIP: "1" # beforeBuildCommand 链复用上一步 sidecar 产物
        run: npx tauri build --bundles msi --config src-tauri/tauri.release.conf.json

      - name: 上传 Release 附件(msi + 签名;latest.json 条目按 UPDATER.md 手工补)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/msi/*.msi.sig
