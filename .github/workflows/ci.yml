name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # osint 插件的 vendor/Photon 是 submodule(许可隔离,GPL 只引用不复制)
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Sync workspace dependencies
        run: uv sync
      - name: Run tests
        run: uv run --no-sync python -m pytest -q --tb=short

  ui-test:
    name: UI component tests (desktop/ui-src)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/ui-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/ui-src/package-lock.json
      # lockfile 权威安装:声明与锁脱节(如漏装依赖)在此直接红,本机侥幸不在场
      - name: Install UI dependencies
        run: npm ci --no-fund --no-audit
      - name: Run UI component tests (5 screens)
        run: npm test
      - name: Type-check and build (tsc -b && vite build)
        run: npm run build

  # 10-03-ci-gates D1:push/PR 对 desktop/src-tauri 此前零编译检查,
  # Rust 弄坏要等 tag 发版流水线才第一次暴露。cargo check 先行,
  # 不加 clippy/fmt/matrix(见该任务 PRD「不做的事」)。
  rust-check:
    name: Rust compile check (desktop/src-tauri)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # tauri 在 Linux 的系统依赖(GTK/WebKit/glib):裸 ubuntu runner 没有,
      # glib-sys 等经 pkg-config 找不到 .pc 直接红(tauri 官方 prerequisites)。
      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev
      # tauri-build 的 build.rs 校验 externalBin 存在性,而 binaries/ 被 gitignore
      # (.gitignore:67),fresh checkout 必须先造占位再 check(不必真跑 PyInstaller;
      # 起草期实测:无占位必红,占位后全绿)。
      - name: Create placeholder externalBin
        run: |
          mkdir -p binaries
          touch "binaries/myia-$(rustc -vV | sed -n 's/^host: //p')"
      - name: cargo check
        run: cargo check --locked

  # 10-03-ci-gates D2:ruff 最小 lint 门禁。select 集在根 ruff.toml
  # (E9/F63/F7/F82,只拦致命错);版本锁死防默认规则面漂移(0.16.10 默认集
  # 起草期实测 498 错)。本地同款:uvx ruff@0.16.10 check .
  ruff:
    name: Python lint (ruff minimal set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff check (locked version)
        run: uvx ruff@0.16.10 check .
