# PyPI Publish — shishi-classifier / shishi 双包发行(1.1.1 起发行名随世事更名;模块名 myia/myia_classifier 过渡保留,模块改名后同步此处校验)(PRD 10-01-v10-classifier-pypi)。
# tag 驱动发布(10-03-tag-release):推 v* tag 即正式发布;手动 dispatch 保留为演练通道。
# 与 CI/Docker 发布刻意分离:CI 管测试,Docker 管镜像,本文件管 PyPI。
#
# ── 触发方式 ─────────────────────────────────────────────────────────────────
#   正式发布 = 推 v* tag:双包同发(shishi + shishi-classifier)到正式 PyPI
#   (OIDC Trusted Publishing),wheels/sdist 附挂到同 tag 的 GitHub Release
#   (见 attach-release job);tag 事件下 inputs 全为空串,三处解析均按 tag 语义
#   落位(repository→pypi / package→both / use-api-token→false 走 OIDC)。
#   手动 dispatch = 演练与兜底:GitHub 仓库页 → Actions → "PyPI Publish" →
#   Run workflow → 选目标仓库 + package + 鉴权方式;默认 test-pypi 演练,
#   也可显式选 pypi 兜底(PyPI 禁止同版本覆盖,重发必须 bump 版本)。
#
# ── Trusted Publishing 四元组(owner 发布前在 PyPI 侧按此核对)──────────────────
#   owner             = xinzhuzi
#   repository        = shishi
#   workflow_filename = pypi-publish.yml
#   environment       = pypi
#   两个项目(myia 与 myia-classifier)各自注册一次,四元组完全相同——同一工作流
#   发多包是 PyPI 官方支持的用法;action 从 OIDC claim 自动取 owner/repo/workflow,
#   YAML 内无需也不应硬编码。逐步操作见 docs/launch/RELEASE.md。
#
# ── 鉴权双通道(dispatch 时二选一)─────────────────────────────────────────────
#   A. Trusted Publishing(OIDC,推荐,零长期凭据):use-api-token 选 false。
#      前置:PyPI 侧注册上面的四元组;本仓库 Settings → Environments 新建 "pypi"。
#   B. API Token:use-api-token 选 true。
#      前置:PyPI → Account settings → API tokens 生成 token(scope 建议 project),
#      本仓库 Settings → Secrets and variables → Actions 新增 secret PYPI_API_TOKEN。
#      工作流有守卫步骤:选了 token 模式但 secret 未配置时立刻报中文错误,不会静默回落。
#   注:TestPyPI 演练已内置为 dispatch input repository(默认 test-pypi,演练优先):
#      选 test-pypi 时 publish action 注入 repository-url: https://test.pypi.org/legacy/,
#      选 pypi 才注入正式 https://upload.pypi.org/legacy/;publisher/token 相应配在
#      test.pypi.org 侧(与 pypi.org 互不相通)。演练步骤见 docs/launch/RELEASE.md
#      的「TestPyPI 演练」节。
#
# 安全说明:工作流内不出现任何凭据字面值;token 仅经 secrets 注入;零第三方安装脚本,
# 构建用 uv 官方 astral-sh/setup-uv,发布用 PyPA 官方 action;inputs 经 env 传入
# shell,不直接内插,杜绝表达式注入面。

name: PyPI Publish

on:
  # tag 驱动(10-03-tag-release):推 v* tag = 正式发布(push 事件 inputs 全空串,
  # 由各步骤解析为 tag 语义:双包 + 正式 PyPI + OIDC;dispatch 演练不受影响)。
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "目标仓库:test-pypi = TestPyPI 演练(默认),pypi = 正式发布;tag 触发固定 pypi,本选项仅对手动 dispatch 生效"
        type: choice
        default: test-pypi
        options:
          - test-pypi
          - pypi
      package:
        description: "要发布的包"
        type: choice
        default: myia-classifier
        options:
          - myia-classifier
          - myia
          - both
      use-api-token:
        description: "用 API Token 上传(false = Trusted Publishing OIDC)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: 守卫:tag 与包版本一致性(仅 tag 事件)
        # 先于一切构建/上传:版本不符即红,零产物离库(10-03-tag-release 决议 5)。
        # 仅 push tag 触发时运行,dispatch 演练不拦;TAG 经 env(GITHUB_REF_NAME)
        # 取再 shell 去前缀,不内插 ${{ }},杜绝表达式注入面。
        # 硬拦:两个 pyproject version 任一 != tag#v → 中文 ::error + exit 1;
        # 软警:桌面侧(tauri.conf.json / Cargo.toml)不符仅 ::warning——桌面打包
        # 版本本就从 tag 注入,无漂移面,警告只为四件套纪律可见。
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_REF: ${{ github.ref_name }}
        run: |
          TAG="${TAG_REF#v}"
          # 1) 格式守卫:v* glob 会放进 vfoo 这类非版本 tag,先拦掉
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag「${TAG_REF}」不是语义化版本(期望 vX.Y.Z 或 vX.Y.Z-rc.N 这类预发布形态);发布 tag 请对照 pyproject version 打。"
            exit 1
          fi
          export TAG
          python - <<'PY'
          import json, os, pathlib, tomllib

          tag = os.environ["TAG"]

          def toml_version(path):
              return tomllib.loads(pathlib.Path(path).read_text(encoding="utf-8"))["project"]["version"]

          root_ver = toml_version("pyproject.toml")
          clf_ver = toml_version("myia-classifier/pyproject.toml")
          tauri_ver = json.loads(pathlib.Path("desktop/src-tauri/tauri.conf.json").read_text(encoding="utf-8"))["version"]
          cargo_ver = tomllib.loads(pathlib.Path("desktop/src-tauri/Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]

          # 硬拦:双 pyproject 必须与 tag 一致(四处事实源:tag / 根 pyproject /
          # classifier pyproject / 桌面两件,版本纪律见 RELEASE.md)
          for label, actual, path in (
              ("根 pyproject", root_ver, "pyproject.toml"),
              ("classifier pyproject", clf_ver, "myia-classifier/pyproject.toml"),
          ):
              if actual != tag:
                  print(
                      f"::error::版本不一致:tag={tag},{label}={actual}({path})。"
                      f"当前三值:tag={tag} / pyproject.toml={root_ver} / "
                      f"myia-classifier/pyproject.toml={clf_ver};桌面侧参考:"
                      f"desktop/src-tauri/tauri.conf.json={tauri_ver} / Cargo.toml={cargo_ver}。"
                      "请把版本四件套与 tag 同 bump 后重推 tag。"
                  )
          if root_ver != tag or clf_ver != tag:
              raise SystemExit(1)

          # 软警:桌面两件不符仅告警,不拦
          for label, actual, path in (
              ("tauri.conf.json", tauri_ver, "desktop/src-tauri/tauri.conf.json"),
              ("Cargo.toml", cargo_ver, "desktop/src-tauri/Cargo.toml"),
          ):
              if actual != tag:
                  print(f"::warning::桌面版本软校验不符:{path}={actual} != tag={tag}(桌面打包版本从 tag 注入,不拦截;{label} 建议随四件套同 bump。)")

          print(f"版本守卫通过:tag={tag} = 根 pyproject={root_ver} = classifier pyproject={clf_ver}")
          PY

      - name: Build distributions
        # uv workspace 双包:根包(myia)与 myia-classifier 是两个独立发行,
        # 分两步 uv build,--out-dir 统一收口到仓库根 dist/(成员默认写各自 dist/)。
        # PACKAGE 经 env 传入,不内插 ${{ }},未知取值直接失败而不是漏建。
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            myia-classifier) uv build myia-classifier --wheel --sdist --out-dir dist ;;
            myia)            uv build . --wheel --sdist --out-dir dist ;;
            both|"")
              # 空串 = tag 事件(push 下 inputs.* 全为空串),tag 发布语义 = 双包
              # 同发(shishi 依赖 shishi-classifier),与 both 同分支。
              uv build myia-classifier --wheel --sdist --out-dir dist
              uv build . --wheel --sdist --out-dir dist
              ;;
            *) echo "::error::未知 package 输入:${PACKAGE}" ; exit 1 ;;
          esac
          echo "built:" && ls -la dist/

      - name: Verify distributions contain packaged data files
        # 发布前硬校验:列 wheel/tar 内容,断言随包数据文件在产物内
        # (classifier 词表 keywords.json;根包 enrich prompt/dedupe_prompt 与 classify shim)。
        # .gitignore 的 data/ 规则曾吞过词表(见 classifier pyproject 的 artifacts 注释),
        # 这一步保证同类回归永远到不了 PyPI。
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python - <<'PY'
          import glob, os, sys, tarfile, zipfile

          package = os.environ["PACKAGE"]
          projects = {
              "myia-classifier": ["myia_classifier"],
              "myia": ["myia"],
              "both": ["myia_classifier", "myia"],
              # 空串 = tag 事件(push 下 inputs.* 全为空串)= 双包同发,与 both 同
              "": ["myia_classifier", "myia"],
          }.get(package)
          if projects is None:
              sys.exit(f"unknown package input: {package!r}")

          needs = {
              "myia_classifier": {
                  "wheel": ["myia_classifier/data/keywords.json"],
                  "sdist": ["src/myia_classifier/data/keywords.json"],
              },
              "myia": {
                  "wheel": [
                      "myia/enrich/data/prompt.json",
                      "myia/enrich/data/dedupe_prompt.json",
                      "myia/classify/__init__.py",
                  ],
                  "sdist": [
                      "src/myia/enrich/data/prompt.json",
                      "src/myia/enrich/data/dedupe_prompt.json",
                      "src/myia/classify/__init__.py",
                  ],
              },
          }

          openers = {
              "wheel": lambda p: zipfile.ZipFile(p).namelist(),
              "sdist": lambda p: tarfile.open(p).getnames(),
          }

          failures = []
          for proj in projects:
              for kind, globpat in (
                  ("wheel", f"dist/{proj}-*.whl"),
                  ("sdist", f"dist/{proj}-*.tar.gz"),
              ):
                  found = sorted(glob.glob(globpat))
                  if not found:
                      failures.append(f"{proj}: no {kind} matching {globpat}")
                      continue
                  for path in found:
                      names = openers[kind](path)
                      print(f"{path}: {len(names)} entries")
                      for needle in needs[proj][kind]:
                          # wheel 条目不带顶层目录,sdist 带 myia[-_classifier]-x.y.z/ 前缀,统一按后缀匹配
                          ok = any(n == needle or n.endswith("/" + needle) for n in names)
                          print(f"  {'OK ' if ok else 'MISSING '}{needle}")
                          if not ok:
                              failures.append(f"{path}: missing {needle}")

          if failures:
              print("\n".join(f"FAIL {f}" for f in failures))
              sys.exit(1)
          print(f"All data-file checks passed for: {', '.join(projects)}")
          PY

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # Trusted Publishing(OIDC)必需;token 模式下也供 PEP 740 attestations 签名用
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Resolve upload repository
        # 演练开关:repository=test-pypi(默认)→ TestPyPI;pypi → 正式 PyPI。
        # URL 经 GITHUB_ENV 传给下方 publish action 的 repository-url,
        # 沿用本文件纪律:inputs 只经 env 进 shell,不在 with 里内插三元表达式。
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          case "$REPOSITORY" in
            test-pypi) url="https://test.pypi.org/legacy/" ;;
            # 空串 = tag 事件(push 下 inputs.* 全为空串):tag 即正式发布语义,固定 pypi
            pypi|"")   url="https://upload.pypi.org/legacy/" ;;
            *) echo "::error::未知 repository 输入:${REPOSITORY}(应为 test-pypi 或 pypi)" ; exit 1 ;;
          esac
          echo "REPOSITORY_URL=${url}" >> "$GITHUB_ENV"
          echo "上传目标:${REPOSITORY:-tag 事件→固定 pypi} → ${url}"

      - name: Check API token is configured (token mode only)
        # 守卫:token 模式但 PYPI_API_TOKEN 未配置 → 立刻中文报错,
        # 不再让空密码静默回落 OIDC 造成难懂的失败。
        # TestPyPI 演练额外提示:token 必须在 test.pypi.org 生成,
        # pypi.org 的 token 在 TestPyPI 无效(反之亦然)。
        if: ${{ inputs.use-api-token }}
        env:
          HAS_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
          REPOSITORY: ${{ inputs.repository }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::选择了 API Token 模式,但仓库未配置 secret PYPI_API_TOKEN。请到 Settings → Secrets and variables → Actions 新增,或改用 Trusted Publishing(use-api-token=false)。"
            exit 1
          fi
          if [ "$REPOSITORY" = "test-pypi" ]; then
            echo "::warning::TestPyPI 演练:请确认 secret PYPI_API_TOKEN 当前存的是 test.pypi.org(Account settings → API tokens)生成的 token;pypi.org 的 token 在 TestPyPI 无效。"
          fi
          echo "PYPI_API_TOKEN secret is set (repository=${REPOSITORY})."

      - name: Publish to PyPI (Trusted Publishing OIDC)
        if: ${{ !inputs.use-api-token }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ env.REPOSITORY_URL }}
          verbose: true

      - name: Publish to PyPI (API token)
        if: ${{ inputs.use-api-token }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ env.REPOSITORY_URL }}
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true

  attach-release:
    # 仅 tag 事件:把 PyPI 产物(wheel/sdist)附挂到同 tag 的 GitHub Release 页,
    # 与桌面资产同页(softprops 对已存在 Release 按 tag 追加资产,desktop-release
    # 双 job 并发调用已有先例);dispatch 演练被 if 排除,TestPyPI 产物不污染 Release。
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write  # 仅本 job 提权以创建/更新 Release;build/publish 维持 contents: read(+id-token)
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach wheels/sdist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
