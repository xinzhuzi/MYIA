# 构建并发布 世事 服务端镜像到 GHCR(ghcr.io/xinzhuzi/shishi)。
# 仅 tag 发布:推送 v* tag 才产镜像(main 推送不产镜像,只跑 ci.yml 门禁);
# 预发布 tag(如 v1.2.0-rc.1)只出版本镜像 tag,不移动 latest。
# 与 ci.yml 刻意分离:CI 管 push/PR 测试门禁,本工作流只管发镜像。

name: Docker Publish

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 仅 semver 一条:X.Y.Z;latest 交给下方 flavor(官方语义,semver 感知预发布)。
          tags: |
            type=semver,pattern={{version}}
          # 默认即 auto,显式声明便于阅读;预发布 tag 不移动 latest——
          # v1.2.0-rc.1 只产 1.2.0-rc.1,正式版才滚动 latest。
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
