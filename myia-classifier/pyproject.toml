[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myia-classifier"
version = "1.1.1"
description = "Zero-dependency seven-category keyword classifier with free/paid dual-signal adjudication, data-driven keyword tables, and a safe custom-rule API. 七大类双信号关键词分类引擎。"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "xinzhuzi"}]
keywords = [
    "classifier",
    "keyword-matching",
    "text-classification",
    "chinese",
    "rule-engine",
    "information-filtering",
    "myia",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]
# 零运行时依赖(PRD 铁律):纯标准库;PyYAML 仅 load_rules 惰性引用,缺失时自然报 ImportError。
dependencies = []

[project.urls]
Homepage = "https://github.com/xinzhuzi/MYIA"
Repository = "https://github.com/xinzhuzi/MYIA"
Issues = "https://github.com/xinzhuzi/MYIA/issues"

[tool.hatch.build.targets.wheel]
packages = ["myia_classifier"]
# 仓库 .gitignore 的 `data/` 规则按构建根相对匹配,会漏掉包内词表数据文件
# (v0.2 已踩过"wheel 缺文件"的坑);artifacts 显式强制收录,双保险。
artifacts = ["myia_classifier/data/*.json"]

[tool.hatch.build.targets.sdist]
artifacts = ["myia_classifier/data/*.json"]
