<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B18"/>
      <stop offset="1" stop-color="#0E1730"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leadfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7DEBFA"/>
    </linearGradient>
    <radialGradient id="nebulaCyan" cx="0.5" cy="0.42" r="0.60">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaViolet" cx="0.80" cy="0.84" r="0.55">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.62" stop-color="#04060F" stop-opacity="0"/>
      <stop offset="1" stop-color="#04060F" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="irisgrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#16305E"/>
      <stop offset="0.72" stop-color="#2A3F7A"/>
      <stop offset="1" stop-color="#5B3FB5"/>
    </radialGradient>
    <radialGradient id="pupilglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底:深空渐变 + 双星云光晕 + 暗角 + 玻璃高光 + 内描边 -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#nebulaCyan)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#nebulaViolet)"/>
  <rect x="38" y="38" width="948" height="420" rx="192" fill="url(#glass)"/>
  <rect x="36" y="36" width="952" height="952" rx="196" fill="none"
        stroke="url(#accent)" stroke-width="4" opacity="0.35"/>

  <!-- 星场 -->
  <circle cx="128" cy="152" r="3.0" fill="#E2E8F0" opacity="0.55"/>
  <circle cx="214" cy="92" r="2.0" fill="#67E8F9" opacity="0.4"/>
  <circle cx="770" cy="78" r="2.0" fill="#E2E8F0" opacity="0.3"/>
  <circle cx="872" cy="122" r="2.6" fill="#A78BFA" opacity="0.5"/>
  <circle cx="924" cy="214" r="2.0" fill="#E2E8F0" opacity="0.35"/>
  <circle cx="92" cy="424" r="1.8" fill="#67E8F9" opacity="0.3"/>
  <circle cx="110" cy="764" r="2.0" fill="#A78BFA" opacity="0.4"/>
  <circle cx="172" cy="884" r="2.5" fill="#E2E8F0" opacity="0.3"/>
  <circle cx="858" cy="834" r="2.0" fill="#67E8F9" opacity="0.45"/>
  <circle cx="924" cy="762" r="3.0" fill="#E2E8F0" opacity="0.3"/>
  <circle cx="884" cy="560" r="1.6" fill="#A78BFA" opacity="0.35"/>
  <circle cx="150" cy="560" r="1.6" fill="#E2E8F0" opacity="0.3"/>
  <path d="M178,167 Q178,182 193,182 Q178,182 178,197 Q178,182 163,182 Q178,182 178,167 Z" fill="#E2E8F0" opacity="0.6"/>
  <path d="M846,233 Q846,244 857,244 Q846,244 846,255 Q846,244 835,244 Q846,244 846,233 Z" fill="#A78BFA" opacity="0.5"/>

  <!-- 外雷达环:主环 + 虚线环 + 四向刻度 -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#22D3EE" stroke-width="3" opacity="0.30"/>
  <circle cx="512" cy="512" r="294" fill="none" stroke="#8B5CF6" stroke-width="2"
          stroke-dasharray="4 14" stroke-linecap="round" opacity="0.45"/>
  <g stroke="#67E8F9" stroke-width="5" stroke-linecap="round" opacity="0.55">
  <line x1="512.0" y1="196.0" x2="512.0" y2="168.0"/>
  <line x1="828.0" y1="512.0" x2="856.0" y2="512.0"/>
  <line x1="512.0" y1="828.0" x2="512.0" y2="856.0"/>
  <line x1="196.0" y1="512.0" x2="168.0" y2="512.0"/>
  </g>

  <!-- 扫掠余辉(纯渐变近似,无滤镜)+ 领先边缘 -->
  <path d="M512.0,512.0 L791.9,337.1 A330,330 0 0 0 745.3,278.7 Z" fill="#22D3EE" opacity="0.15"/>
  <path d="M512.0,512.0 L745.3,278.7 A330,330 0 0 0 686.9,232.1 Z" fill="#22D3EE" opacity="0.124"/>
  <path d="M512.0,512.0 L686.9,232.1 A330,330 0 0 0 619.4,200.0 Z" fill="#22D3EE" opacity="0.098"/>
  <path d="M512.0,512.0 L619.4,200.0 A330,330 0 0 0 546.5,183.8 Z" fill="#22D3EE" opacity="0.072"/>
  <path d="M512.0,512.0 L546.5,183.8 A330,330 0 0 0 471.8,184.5 Z" fill="#22D3EE" opacity="0.046"/>
  <line x1="512" y1="512" x2="791.9" y2="337.1" stroke="url(#leadfade)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="791.9" cy="337.1" r="7" fill="#7DEBFA"/>

  <!-- 眼形:外辉光 + 主描边(560 半径双弧) -->
  <path d="M142,512 A560,560 0 0 1 882,512 A560,560 0 0 1 142,512"
        fill="none" stroke="url(#accent)" stroke-width="46" stroke-linecap="round" opacity="0.16"/>
  <path d="M142,512 A560,560 0 0 1 882,512 A560,560 0 0 1 142,512"
        fill="none" stroke="url(#accent)" stroke-width="24" stroke-linecap="round"/>

  <!-- 虹膜:渐变盘 + 纹理 + 雷达环 -->
  <circle cx="512" cy="512" r="168" fill="url(#irisgrad)"/>
  <g stroke="#9DB8F5" stroke-width="5" stroke-linecap="round" opacity="0.30">
  <line x1="588.0" y1="512.0" x2="670.0" y2="512.0"/>
  <line x1="577.8" y1="550.0" x2="648.8" y2="591.0"/>
  <line x1="550.0" y1="577.8" x2="591.0" y2="648.8"/>
  <line x1="512.0" y1="588.0" x2="512.0" y2="670.0"/>
  <line x1="474.0" y1="577.8" x2="433.0" y2="648.8"/>
  <line x1="446.2" y1="550.0" x2="375.2" y2="591.0"/>
  <line x1="436.0" y1="512.0" x2="354.0" y2="512.0"/>
  <line x1="446.2" y1="474.0" x2="375.2" y2="433.0"/>
  <line x1="474.0" y1="446.2" x2="433.0" y2="375.2"/>
  <line x1="512.0" y1="436.0" x2="512.0" y2="354.0"/>
  <line x1="550.0" y1="446.2" x2="591.0" y2="375.2"/>
  <line x1="577.8" y1="474.0" x2="648.8" y2="433.0"/>
  </g>
  <circle cx="512" cy="512" r="170" fill="none" stroke="url(#accent)" stroke-width="13"/>
  <circle cx="512" cy="512" r="122" fill="none" stroke="url(#accent)" stroke-width="9" opacity="0.85"/>

  <!-- 瞳孔:辉光 + 暗芯 + 光晕环 + 高光 -->
  <circle cx="512" cy="512" r="66" fill="url(#pupilglow)"/>
  <circle cx="512" cy="512" r="50" fill="#030712"/>
  <circle cx="512" cy="512" r="50" fill="none" stroke="#22D3EE" stroke-width="3" opacity="0.8"/>
  <circle cx="512" cy="512" r="20" fill="#67E8F9"/>
  <circle cx="494" cy="486" r="10" fill="#EAFBFF" opacity="0.95"/>

  <!-- 信号触点 -->
  <circle cx="667.1" cy="313.4" r="34" fill="none" stroke="#A78BFA" stroke-width="5" opacity="0.28"/>
  <circle cx="667.1" cy="313.4" r="22" fill="none" stroke="#A78BFA" stroke-width="6" opacity="0.55"/>
  <circle cx="667.1" cy="313.4" r="12" fill="#C4B5FD"/>
  <circle cx="255.5" cy="719.7" r="14" fill="none" stroke="#22D3EE" stroke-width="4" opacity="0.35"/>
  <circle cx="255.5" cy="719.7" r="7" fill="#67E8F9" opacity="0.9"/>

  <!-- 暗角收边 -->
  <rect width="1024" height="1024" rx="228" fill="url(#vignette)"/>
</svg>
