# myia-maxun — 官方场景件:无代码爬虫平台(封装 getmaxun/maxun)。
#
# 许可注意:上游 Maxun 为 AGPL-3.0 —— 本插件只以 manifest 声明依赖、文档
# 引用与 compose 引用官方镜像的方式接入,**不复制其任何源码进本仓库**。
id: myia-maxun
name: 无代码爬虫平台(Maxun)
version: 1.0.0
compatible: ">=0.1,<2.0"
requires: docker
provides: [maxun]
modes:
  local:
    compose: docker-compose.yml
    install: docker compose up -d
  remote:
    # 上游鉴权为控制台会话(浏览器登录),无稳定 API token 契约,故无 token 声明。
    endpoint: https://maxun.example.com
install:
  source: https://github.com/xinzhuzi/MYIA.git
