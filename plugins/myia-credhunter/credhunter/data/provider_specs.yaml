# 验证层供应商规格(verification specs)——myia-credhunter 数据文件。
#
# 行为规格:.trellis/tasks/10-03-aipocket-fusion/research/behavior-specs/
# fingerprints.md §1/§3/§4/§5/§6(25 规格)。字段语义:
#   name              供应商标识
#   category          international | domestic | gateway | coding_agent | cloud
#   domain_suffixes   apiurl 域名后缀匹配(resolve 的主通道,域名优先)
#   key_prefixes      密钥前缀匹配(resolve 的兜底通道)。泛前缀(如 sk-)
#                     刻意不进此列——会吞掉所有 sk-* 网关键(规格 §4 注意)
#   protocol          openai_compatible | anthropic | gemini | vertex | aws_bedrock
#                     (决定验证请求形状;请求装配在 credcheck 阶段实现)
#   models            默认探测模型(models 端点 2xx 空列表即判 invalid-response)
#   official_api_url  官方 API 基址;空串 = 无统一官方地址(azure_openai 需
#                     部署级资源 URL,规格明示为空;验证层据此报 no_api_url)
# 官方地址来源:行为规格钉死者照抄;其余为各供应商公开文档地址
# (ksyun=金山云星流平台、longcat=美团 LongCat 已按官方文档核),
# 与发现层 provider_packs.yaml 的 id 一一对应(packs 多 azure_openai 查询、
# specs 多 nvidia/ksyun/siliconflow/groq/openrouter,差集照规格 §3)。
# 加供应商 = 在本文件加一节,零代码改动(loader 见 credhunter/specs.py)。
specs:
  - name: openai
    category: international
    domain_suffixes: [openai.com, oaiusercontent.com]
    key_prefixes: [sk-proj-, sk-admin-, sk-svcacct-]
    protocol: openai_compatible
    models: [gpt-4o-mini]
    official_api_url: https://api.openai.com/v1
  - name: anthropic
    category: international
    domain_suffixes: [anthropic.com, claude.ai]
    key_prefixes: [sk-ant-]
    protocol: anthropic
