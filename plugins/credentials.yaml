# plugins/credentials.yaml — credential hunter fed by a self-hosted aipocket REST API.
id: credentials
name: 凭证猎手
schedule: "0 */2 * * *"           # every 2 hours
timezone: Asia/Shanghai

sources:
  - name: aipocket
    engine: direct_api            # REST API (L1); point at your own aipocket deployment
    url: "https://aipocket.example.com/api/v1/leaks?page={page}"
    method: GET
    headers:
      Authorization: "Bearer env:AIPOCKET_TOKEN"   # token via env reference, never plaintext
    pagination:
      mode: template
      max_pages: 10
    extract:
      type: json_path
      fields:
        title: "$[*].keyword"
        url: "$[*].source_url"
        time: "$[*].discovered_at"
    rate_limit:
      qps: 0.2
      backoff: exponential
      respect_robots: true
    proxy: direct
    retry: 3

dedup:
  key: "{url}"

push:
  - channel: feishu_card
    target: env:FEISHU_CHAT_ID
    route:
      - when: "score >= 8"
        mode: immediate
      - when: "score >= 5"
        mode: digest
      - when: "score < 5"
        mode: archive
    template: |
      **新凭证情报 · {{date}}**
      {{#each items}}
      - {{title}} ({{url}})
      {{/each}}
