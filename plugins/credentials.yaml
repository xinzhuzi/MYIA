# plugins/credentials.yaml — credential hunter fed by a self-hosted aipocket REST API.
#
# v0.3 plugin-market form: the `plugin:` section declares the scenario plugin
# (myia-credentials, see plugins/myia-credentials/) with dual-mode semantics —
# endpoint + keychain token placeholders only, never a hardcoded address.
# A missing/broken plugin never blocks the core pipeline (iron law).
id: credentials
name: 凭证猎手
schedule: "0 */2 * * *"           # every 2 hours
timezone: Asia/Shanghai

plugin:                             # scenario plugin declaration (dual mode, v1.7)
  id: myia-credentials
  requires: []                      # remote-only: REST endpoint + token, no docker needed
  modes:
    remote:
      endpoint: https://aipocket.example.com   # your aipocket deployment (endpoint placeholder)
      token: keychain:myia/credentials/token   # myia secret set myia/credentials/token

sources:
  - name: aipocket
    engine: direct_api            # REST API (L1); point at your own aipocket deployment
    url: "https://aipocket.example.com/api/v1/leaks?page={page}"
    method: GET
    headers:
      # 钥匙链凭据引用,规范名空间 myia/<scope>/<name>(写入:
      # myia secret set myia/credentials/token)
      Authorization: "Bearer keychain:myia/credentials/token"
    pagination:
      mode: template
      max_pages: 10
    extract:
      type: json_path
      fields:
        title: "$[*].keyword"
        url: "$[*].source_url"
        time: "$[*].discovered_at"
    rate_limit:
      qps: 0.2
      backoff: exponential
      respect_robots: true
    proxy: direct
    retry: 3

dedup:
  key: "{url}"

push:
  - channel: feishu_card
    target: env:FEISHU_CHAT_ID
    route:
      - when: "score >= 8"
        mode: immediate
      - when: "score >= 5"
        mode: digest
      - when: "score < 5"
        mode: archive
    template: |
      **新凭证情报 · {{ date }}**
      {% for item in items %}
      - {{ item.title }} ({{ item.url }})
      {% endfor %}
