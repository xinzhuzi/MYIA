# plugins/credentials.yaml — credential hunter: native in-process GitHub hunt
# (myia-credhunter) + optional aggregation over a self-hosted aipocket REST API
# (myia-credentials, kept as the optional remote lane per task Q2).
#
# v0.3 plugin-market form: the `plugin:` section declares the remote scenario
# plugin (myia-credentials, see plugins/myia-credentials/) with dual-mode
# semantics — endpoint + keychain token placeholders only, never a hardcoded
# address. A missing/broken plugin never blocks the core pipeline (iron law).
#
# 10-03-aipocket-fusion: the native source below rides `engine: credhunter`
# (链外源引擎 — in the EngineName vocabulary, never in the L1-L6 auto chain;
# explicit selection only, failure = structured per-source failure). Findings
# are masked-only (前 8 后 4, Q9): full keys never enter items/push templates.
# GitHub tokens live in the keychain (`myia secret set myia/credhunter/github-token`);
# without a token the lane stays in its explicit empty state (无 token 该源
# 不启用, spec §2 upstream semantics — write the secret and the lane resumes).
id: credentials
name: 凭证猎手
schedule: "0 */2 * * *"           # every 2 hours
timezone: Asia/Shanghai

plugin:                             # scenario plugin declaration (dual mode, v1.7)
  id: myia-credentials
  requires: []                      # remote-only: REST endpoint + token, no docker needed
  modes:
    remote:
      endpoint: https://aipocket.example.com   # your aipocket deployment (endpoint placeholder)
      token: keychain:myia/credentials/token   # myia secret set myia/credentials/token

sources:
  # Native主力(R1):GitHub 工件猎取——code search(≤5 页×100)+ commit
  # message(≤12 查询/run,checkpoint 跨 run 轮转)两泳道,联合正则十大
  # 密钥族;限速仅 403/429 退避(≤90s 只重试一轮)。注意:首轮全量查询池
  # 可能超出单源 fetch 预算(120s),增量轮次按 checkpoint 续跑。
  - name: credhunter-native
    engine: credhunter             # 链外源引擎(myia-credhunter 场景件)
    url: "https://api.github.com"  # 上游锚点(真实查询/凭据走 engine_options)
    engine_options:
      credhunter:
        lane: credhunt
        github_tokens:
          - keychain:myia/credhunter/github-token
          # myia secret set myia/credhunter/github-token
        checkpoint_file: .myia/credhunter/credentials-checkpoint.json
    proxy: direct
    retry: 0                       # 泳道自带 token 轮转/退避,不吃引擎重试

  # 可选聚合源(Q2:保留共存):已部署 aipocket 实例的 REST 拉取。
  - name: aipocket
    engine: direct_api            # REST API (L1); point at your own aipocket deployment
    url: "https://aipocket.example.com/api/v1/leaks?page={page}"
    method: GET
    headers:
      # 钥匙链凭据引用,规范名空间 myia/<scope>/<name>(写入:
      # myia secret set myia/credentials/token)
      Authorization: "Bearer keychain:myia/credentials/token"
    pagination:
      mode: template
      max_pages: 10
    extract:
      type: json_path
      fields:
        title: "$[*].keyword"
        url: "$[*].source_url"
        time: "$[*].discovered_at"
    rate_limit:
      qps: 0.2
      backoff: exponential
      respect_robots: true
    proxy: direct
    retry: 3

dedup:
  key: "{url}"

push:
  - channel: feishu_card
    target: env:FEISHU_CHAT_ID
    route:
      - when: "score >= 8"
        mode: immediate
      - when: "score >= 5"
        mode: digest
      - when: "score < 5"
        mode: archive
    template: |
      **新凭证情报 · {{ date }}**
      {% for item in items %}
      - {{ item.title }} ({{ item.url }})
      {% endfor %}
