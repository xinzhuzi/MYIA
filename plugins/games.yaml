# plugins/games.yaml — official plugin: game deal intelligence (折扣/限免)
# over three public official APIs — Epic weekly freebies + Steam daily
# specials + CheapShark multi-store deals(v3, task 10-03-games-v3;source
# evidence 2026-10-03 in .trellis/tasks/10-03-games{,-v3}/evidence/).
# Same 12-section shape as stocks/gpu-prices with every section explained
# inline ("AI writes the YAML" reference duty). Load-check any plugin with:
#   myia run plugins/games.yaml --dry-run --json

id: games
name: 游戏情报

# 每日 11:00(AM 槽)一跑:Epic 喜加一周四刷新、Steam 特惠每日轮换,每日
# 一跑全覆盖。长促销会在每个新槽位/新日重推一次(dedup 槽位抑制语义,
# 窗口期可见性优先,grill 决议⑥);嫌吵调稀 cron(如 0 11 * * 4,6)是
# 排程旋钮,不动结构。
schedule: "0 11 * * *"
timezone: Asia/Shanghai

sources:
  # Epic 每周限免官方 JSON(zh-CN 标题直出;robots.txt 404 = 无限制)。
  # 响应元素没有可点的页面 URL(url 恒 None,只有 urlSlug)——这正是
  # stocks.yaml 注释记录过的 schema 缺口,由 extract.url_template(D1,
  # 10-03-games)收口:提取出口用 {url_slug} 渲染条目 URL。
  - name: epic-free
    engine: direct_api          # L1 JSON API;零成本最快路径
    url: "https://store-site-backend-static.ak.epicgames.com/freeGamesPromotions?locale=zh-CN&country=CN&allowCountries=CN"
    method: GET
    headers:                    # 无凭据头;honest MYIA UA 用引擎缺省
      Accept: "application/json"   # (stocks 的 Yahoo 教训:别伪装浏览器头)
    extract:                    # json_path:字段全部走同一 elements[*] 前缀,
      type: json_path           # 逐元素提取,缺字段省略不错位(无促销元素
                                # 自然没有 discount_pct)
      # 条目 URL = 商店页 + slug;占位符在装载期与 fields 交叉校验(拼错即
      # 拒载)。url_slug 取 catalogNs.mappings 的 pageSlug 而非顶层 urlSlug:
      # 实测 12 条中 4 条 urlSlug 是 32 位 hash(不可读也可能不可点),而
      # mappings.pageSlug 12/12 全覆盖且就是官方商店 slug 形态。偶发
      # mappings 空的元素 url 渲染为空串,该条目被管线按 invalid_item 记
      # 失败后丢弃——不带坏链接入库(design R1 修正口径,v1 接受该损失面:
      # 损失的是那一条情报,不是数据质量)
      url_template: "https://store.epicgames.com/zh-CN/p/{url_slug}"
      fields:
        title: "$.data.Catalog.searchStore.elements[*].title"                                # zh-CN 直出
        url_slug: "$.data.Catalog.searchStore.elements[*].catalogNs.mappings[0].pageSlug"    # 构 URL 用(见上:hash urlSlug 形态由此消解)
        final_price: "$.data.Catalog.searchStore.elements[*].price.totalPrice.discountPrice"     # 分(decimals=2);限免=0
        original_price: "$.data.Catalog.searchStore.elements[*].price.totalPrice.originalPrice"  # 分
        price_text: "$.data.Catalog.searchStore.elements[*].price.totalPrice.fmtPrice.discountPrice"  # "¥60.00" 直出,免换算
        discount_pct: "$.data.Catalog.searchStore.elements[*].promotions.promotionalOffers[0].promotionalOffers[0].discountSetting.discountPercentage"  # 仅当前促销存在;缺=无促销
        upcoming_pct: "$.data.Catalog.searchStore.elements[*].promotions.upcomingPromotionalOffers[0].promotionalOffers[0].discountSetting.discountPercentage"  # 下周促销 %;=100 即「下周免费」(缺=无预告;10-03-games-v2 决议②字段融合)
        upcoming_start: "$.data.Catalog.searchStore.elements[*].promotions.upcomingPromotionalOffers[0].promotionalOffers[0].startDate"  # ISO UTC;模板切 [:10] 即生效日(北京时间当晚 23:00,同日)
    # 无 pagination:单请求全量返回(不需要 {page} 翻页)
    rate_limit:                 # 礼貌档(同 stocks)
      qps: 0.5
      jitter: "2s"
      backoff: exponential
      respect_robots: true      # Epic robots.txt 404(无限制),缺省即允许
    proxy: direct
    retry: 3

  # Steam 每日特惠官方接口(featuredcategories 的 specials 即特惠区,
  # discount_percent 直出;store.steampowered.com robots 不禁 /api/)。
  # 响应只有数字 id 没有页面 URL —— 同样走 url_template(D1)。
  - name: steam-specials
    engine: direct_api
    url: "https://store.steampowered.com/api/featuredcategories?cc=cn"
    method: GET
    headers:
      Accept: "application/json"
    extract:
      type: json_path
      url_template: "https://store.steampowered.com/app/{steam_id}"  # int 渲染成 str
      fields:
        title: "$.specials.items[*].name"            # 游戏名
        steam_id: "$.specials.items[*].id"           # int;构 URL 用
        final_price: "$.specials.items[*].final_price"      # 分(样本 1360=¥13.60)
        original_price: "$.specials.items[*].original_price"  # 分
        discount_pct: "$.specials.items[*].discount_percent"  # int 直出(样本 90)
        expire: "$.specials.items[*].discount_expiration"     # unix 秒;入库供后续 UI/排序(沙箱无日期格式化,模板不显示)
    rate_limit:
      qps: 0.5
      jitter: "2s"
      backoff: exponential
      respect_robots: true
    proxy: direct
    retry: 3

  # CheapShark 多店折扣聚合官方 API(v3,task 10-03-games-v3):一个稳定公共
  # 接口盖 GOG(storeID=7)/Humble(11)/Fanatical(15)三店的**付费折扣**——
  # 与 Steam featured 源零重叠(Steam 店 storeID=1 不在集合),小众 key 店
  # 噪音(Aldorlea 类 96% off 刷屏)由白名单天然排除。限免仍归 Epic 官方源:
  # CS 实测无 0 元 deal(evidence/cs-free.json 空集),它不是限免通道。
  # **响应是顶层数组**:字段前缀 $[*]——与 Epic/Steam 的嵌套 elements[*]/
  # items[*] 前缀不同,extract_json 的「同前缀逐元素提取」同样适用(缺字段
  # 逐元素省略,不错位)。美元字段**独立命名不归一**(v3 决议④):人民币分
  # 基线不容美元元,sale_price/savings_pct 不进 final_price/baseline。
  - name: cheapshark
    engine: direct_api          # L1 JSON API;零成本最快路径
    url: "https://www.cheapshark.com/api/1.0/deals?storeID=7,11,15&sortBy=Savings&pageSize=20"
    method: GET
    headers:                    # 无凭据头;honest MYIA UA 用引擎缺省——CS 实测
      Accept: "application/json"   # 拒 generic UA,MYIA/0.1 描述性 UA 放行
    extract:
      type: json_path           # 顶层数组:全部字段同一 $[*] 前缀,逐元素提取
      # 条目 URL = .com 域 redirect + dealID(决议⑤:.net 域本机两次 SSL 拒连
      # 记档不纠缠)。dealID **已 URL-encoded**(%2F/%2B/%3D),直接拼链接、
      # 不要再编码——占位符在装载期与 fields 交叉校验(拼错即拒载)。
      url_template: "https://www.cheapshark.com/redirect?dealID={deal_id}"
      fields:
        title: "$[*].title"             # 游戏名
        deal_id: "$[*].dealID"          # 构 URL 用(已 URL-encoded,见上)
        sale_price: "$[*].salePrice"    # 美元元,字符串直出("0.50";不归一 final_price)
        savings_pct: "$[*].savings"     # 字符串 %("97.057092");规则里 float() 白名单转换
        normal_price: "$[*].normalPrice"  # 美元元,字符串直出("16.99")
        metacritic: "$[*].metacriticScore"  # 显示参考(字符串;0 = 无评分)
    # 无 pagination:pageSize=20 单请求全量(每日 1 请求,不需要 {page} 翻页)
    rate_limit:                 # 礼貌档(同 Epic/Steam)
      qps: 0.5
      jitter: "2s"
      backoff: exponential
      # deliberate override(v3 决议①,有据推翻已批):CS robots.txt 明文
      # Disallow: /api/1.0/,循 stocks/Yahoo 判例——结构化公共数据 API、官方
      # 文档公开邀请、qps 0.5 礼貌档低频(每日 1 请求)。**回退条件:本源若
      # 复用为页面爬取(HTML)前必须翻回 true。**
      respect_robots: false
    proxy: direct
    retry: 3

watchlist:                      # enrich 关闭时仅做提及量统计,不做降权
  keywords: [喜加一, 限免, 免费, 史低, 折扣, 白嫖]   # (核订:watchlist 只在
  mute: [抽奖, 求购, 二手, 代练]                     # enrich 阶段消费,不会误杀标题)

classify:                       # 零 token 第一漏斗;游戏标题不落七大类,
  builtin: false                # 内置扫描只会误杀,同 gpu-prices 口径关闭
  rules:
    # 两源产出同名归一化字段(final_price/discount_pct),规则缺字段整条
    # 让路(含 None 运算 = 该条不命中)——无促销条目自然落空
    - name: 限免
      when: "final_price == 0 or discount_pct >= 100"
      tag: 限免
    # v2 决议②:「下周免费」预告——字段融合进同一条目(upcoming_pct 并列
    # 提取),dedup 稳定 {url} 不动:预告日 digest、正式限免日新槽 immediate,
    # 切换碰撞由槽位抑制语义自然消解。预告不是现在能领的,路由不设
    # immediate(final_price>0 天然落 digest)。
    - name: 下周免费
      when: "upcoming_pct >= 100"
      tag: 下周免费
    - name: 大折扣
      when: "discount_pct >= 50"
      tag: 半价+
    # v3 决议④:CheapShark 美元折扣源——savings 是字符串 %("97.057092"),
    # float() 是规则白名单函数;缺字段整条让路(float(None) 求值失败按
    # 不命中),Epic/Steam 条目无 savings_pct 天然无感,零归一成本共存。
    # 路由不加 immediate:跳楼价在 digest 里按 savings 排序自然置顶,
    # immediate 仍只属限免(决议④路由零改动)。
    - name: 多店大折扣
      when: "float(savings_pct) >= 50"
      tag: 多店半价+

dedup:
  key: "{url}"                  # 稳定键(不带 {date}):槽位抑制语义下同一条
                                # 每天每槽最多重推一次;baseline 价格历史按
                                # dedup_key 存,带 {date} 每天换键会断链
                                # (vs_yesterday 失效)。{title} schema 永拒。

enrich:                         # 零 token 路线:游戏价格数值自解释,不烧
  enabled: false                # LLM 精评(趋势交给 baseline 数值基线)

baseline:                       # v0.4 趋势基线(sidecar 节):两家单位同为分,
  enabled: true                 # final_price 可直接比
  fields: [final_price]         # vs_yesterday 给「这游戏今天又降了」
  windows: [day, week]          # msrp 对照不进:游戏 SKU 名对照不现实,
                                # 史低判定交给折扣阈值 + 价格趋势(D4)

push:
  - channel: feishu_card        # 单通道起步(grill 决议⑤);telegram 后续
    target: env:FEISHU_CHAT_ID  # 加挂 = YAML 再加一个 push 条目,不动结构。
                                # bot token 走渠道缺省 env:FEISHU_BOT_TOKEN。
    route:                      # 首匹配;规则未命中走保守缺省 digest
      - when: "final_price == 0 or discount_pct >= 100"   # 喜加一即推
        mode: immediate
      - when: "final_price > 0"                           # 普通折扣进日报
        mode: digest
    # 三源字段形态并存(v3):价格优先 price_text(Epic "¥60.00"/"0" 直出),
    # Steam 无该字段退 final_price/100(分 → 元),CS 条目两者皆无 → 美元段
    # $sale_price(原价 normal_price)直出(字符串形态免换算)。守卫用
    # `is defined`/`default`:StrictUndefined 下裸 default(final_price/100)
    # 对 CS 条目会先求值缺字段而炸(default 实参是急求值)。savings 是字符串
    # %,先 |float 再 |round|int(裸 |round 对 str 直接 TypeError)。折扣只在
    # 有值时显示(vs_yesterday 无历史时渲染空串,不是错误)。
    template: |
      **游戏情报 · {{ date }}**
      {% for item in items %}
      - [{{ item.title }}]({{ item.url }}) {% if item.price_text is defined %}{{ item.price_text }}{% elif item.final_price is defined %}{{ item.final_price / 100 }}{% endif %}{% if item.sale_price is defined %}${{ item.sale_price }}(原价 {{ item.normal_price }}){% endif %}{% if item.discount_pct | default(0) > 0 %} -{{ item.discount_pct }}%{% endif %}{% if item.savings_pct | default(0) | float > 0 %} -{{ item.savings_pct | float | round | int }}%{% endif %}{% if item.upcoming_pct | default(0) >= 100 %} 📅{{ item.upcoming_start[:10] }}起免费{% endif %} {{ vs_yesterday(item, 'final_price') }}
      {% endfor %}

storage:                        # 基线期自动长于条目期:metric_history 按
  retention: 90d                # 2× retention 保留(周环比至少两个完整窗口)
  vacuum: monthly
