[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myia"
version = "0.1.0"
description = "AI-native intelligence hub — config-driven fetch, classify, analyze, push. 说需求,AI 做其余。"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "xinzhuzi"}]
dependencies = [
    "httpx[socks]>=0.27",
    "selectolax>=0.3.21",
    "PyYAML>=6.0.1",
    "APScheduler>=3.10,<4",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "keyring>=25",
    # 分类引擎已拆为独立发行(任务 10-01-v10-classifier-pypi);固定版本范围,
    # 语义由 src/myia/classify 兼容 shim 保留,import 路径不变。
    "myia-classifier>=0.1,<0.2",
]

[project.optional-dependencies]
crawl4ai = ["crawl4ai"]
scrapling = ["scrapling"]
firecrawl = ["firecrawl-py"]
skyvern = ["skyvern"]
llm = ["openai>=1.30"]
all = ["crawl4ai", "scrapling", "firecrawl-py", "skyvern", "openai>=1.30"]

[project.scripts]
myia = "myia.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.workspace]
members = ["packages/*"]

# myia-classifier 不发布到 PyPI 前先按 workspace 成员解析;发布后可切回注册表源。
[tool.uv.sources]
myia-classifier = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/myia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
