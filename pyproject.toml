[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myia"
version = "0.1.0"
description = "AI-native intelligence hub — config-driven fetch, classify, analyze, push. 说需求,AI 做其余。"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "xinzhuzi"}]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "PyYAML>=6.0.1",
    "APScheduler>=3.10,<4",
    "pydantic>=2.7",
]

[project.optional-dependencies]
crawl4ai = ["crawl4ai"]
scrapling = ["scrapling"]
firecrawl = ["firecrawl-py"]
skyvern = ["skyvern"]
llm = ["openai>=1.30"]
all = ["crawl4ai", "scrapling", "firecrawl-py", "skyvern", "openai>=1.30"]

[project.scripts]
myia = "myia.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
